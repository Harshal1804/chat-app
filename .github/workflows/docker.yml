name: Chat App CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build Docker Image
      run: docker build -t chat-app ./backend

    - name: Run Container Test
      run: docker run -d -p 5000:5000 chat-app