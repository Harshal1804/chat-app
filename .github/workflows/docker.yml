name: Docker CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Build Docker Image
      run: docker build -t chat-app .

    - name: Run Container (Test)
      run: docker run -d -p 8000:8000 chat-app

    - name: Stop Container
      run: docker ps -q | xargs -r docker stop
